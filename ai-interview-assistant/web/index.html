<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Interview Assistant</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="light">
  <button id="themeToggle" aria-label="Toggle Dark Light Theme">🌙</button>
  <div class="container" role="main" aria-label="AI Interview Assistant">
    <header>
      <h1>AI Interview Assistant</h1>
    </header>
    <main>
      <section class="questions" aria-label="User Questions">
        <div class="heading-row">
          <span class="heading-text">Questions</span>
          <hr class="heading-hr">
        </div>
        <div id="questionsArea" role="log" aria-live="polite" aria-atomic="true" tabindex="0">
          Your questions will appear here...
        </div>
      </section>
      <section class="answers" aria-label="AI Answers">
        <div class="heading-row">
          <span class="heading-text">Answers <span id="ttsToggle" title="Toggle Text-to-Speech"
              style="cursor:pointer;">🔊</span></span>
          <hr class="heading-hr">
        </div>
        <div id="answersArea" role="log" aria-live="polite" aria-atomic="true" tabindex="0">
          AI answers will appear here...
        </div>
      </section>

    </main>
    <div class="button-container" role="region" aria-label="Control Panel">
      <input type="password" id="apiKeyInput" placeholder="Enter your Gemini API Key" aria-label="API Key Input" />
      <button id="saveApiKey" type="button" aria-label="Save API Key">Save API Key</button>
      <button id="deleteApiKey" type="button" aria-label="Change or Remove API Key">Change/Remove API Key</button>
      <button id="listenButton" type="button" aria-label="Toggle Listening">
        Start Listening
        <div class="spinner"></div>
      </button>
      <button id="voiceStopButton" type="button" aria-label="Stop Voice">
        Stop Voice
      </button>
      <button id="clearButton" type="button" aria-label="Clear Text">Clear Text</button>
    </div>
  </div>
  <footer>
    © All rights reserved Prajakta Singhal
  </footer>
  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-message" tabindex="-1">
    <div class="modal-content">
      <span id="modalClose" class="close" aria-label="Close Modal" role="button" tabindex="0">×</span>
      <p id="modal-message" class="text-center"></p>
    </div>
  </div>
  <script type="text/javascript" src="/eel.js"></script>
  <script src="script.js"></script>
</body>

</html>
